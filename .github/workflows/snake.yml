name: Generate contribution snake

on:
  schedule:
    # 每天自动更新一次，时间为 UTC 03:23
    - cron: "23 3 * * *"

  # 允许在 Actions 页面手动运行
  workflow_dispatch:

  # 首次提交后立即生成
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#007AFF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#0A84FF

      - name: Publish SVG files
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
