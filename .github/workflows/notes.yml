name: Update recent notes

on:
  schedule:
    # Daily at 08:17 Asia/Shanghai (00:17 UTC).
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update_notes.py
      - tests/**
      - .github/workflows/notes.yml

permissions:
  contents: write

concurrency:
  group: recent-notes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test notes updater
        run: python -m unittest discover -s tests -v
      - name: Refresh recent notes
        run: python scripts/update_notes.py
      - name: Commit changed notes
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Recent notes are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(profile): update recent notes"
          git push
