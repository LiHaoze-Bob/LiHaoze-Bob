name: Update WakaTime stats

on:
  workflow_dispatch:
  schedule:
    # Daily at 09:37 Asia/Shanghai, separate from the notes update.
    - cron: "37 1 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/wakatime.yml
      - scripts/update_wakatime.py
      - tests/test_update_wakatime.py

permissions:
  contents: write

concurrency:
  group: wakatime-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test profile updaters
        run: python -m unittest discover -s tests -v
      - name: Update seven-day stats including today
        env:
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
        run: python scripts/update_wakatime.py
      - name: Commit changed stats
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "WakaTime stats are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(profile): update weekly coding stats"
          git pull --rebase origin main
          git push
